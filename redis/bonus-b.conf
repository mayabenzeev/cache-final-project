# Bonus B - a deliberately tiny Redis.
# Used by `docker compose --profile bonus-b up -d redis-small` (port 6380)
# and by BonusBEvictionLabTest.

# Redis itself uses about 1MB, so this leaves room for only a few thousand small keys
maxmemory 4mb

# What to delete when memory is full. Try each one and re-run the lab:
#   noeviction      refuse new writes (the default in plain Redis)
#   allkeys-lru     evict the least recently used key, TTL or not
#   allkeys-lfu     evict the least frequently used key, TTL or not
#   volatile-lru    evict the least recently used key, ONLY among keys with a TTL
#   volatile-ttl    evict the key closest to expiring, ONLY among keys with a TTL
maxmemory-policy allkeys-lru

# No persistence: this is a cache
save ""
appendonly no
