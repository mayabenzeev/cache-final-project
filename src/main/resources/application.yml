spring:
  application:
    name: telco-cache-workshop
  cache:
    type: redis
  docker:
    compose:
      # Starts docker-compose.yml when the app starts, and leaves Redis running when you stop
      # the app, so you can keep inspecting it with redis-cli and RedisInsight.
      lifecycle-management: start-only

telco:
  slow-db:
    read-delay: 1000ms
    write-delay: 300ms

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-14logger{0} %msg%n"
